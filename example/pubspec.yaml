name: market_chart_example
description: "Example app for the market_chart package: live Binance prices with indicators, and simulated prices when offline."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  market_chart:
    path: ../
  stream_channel: ^2.1.4
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
